# Bedrock on-demand 단가(US-7.2, T2.8). 단위: USD / 1M 토큰.
# 출처: AWS Price List API, 서비스 코드 AmazonBedrockFoundationModels(Bedrock 가격 페이지의 기계 판독판).
# 가격 페이지(https://aws.amazon.com/bedrock/pricing/)는 표를 스크립트로 그려 본문에서 값을 읽지 못했다.
# 행: feature "On-demand Inference", usagetype "<리전>-MP:<리전>_InputTokenCount_Global-Units",
