# us-east-1, us-west-2, ap-northeast-2 세 리전 값이 같다. Regional(CRIS) 값은 입력 3.30, 출력 16.50이다.
source: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonBedrockFoundationModels/current/us-east-1/index.json
page: https://aws.amazon.com/bedrock/pricing/
publication_date: "2026-10-12T08:40:08Z"
checked: "2026-11-05"
unit: USD per 1M tokens
models:
  global.anthropic.claude-sonnet-4-6:
    name: Claude Sonnet 4.6
    input: 3.0
    output: 15.0
  # US 교차 리전 프로필(생성 모델 전환용). Regional(CRIS) 단가다. usagetype은 `_Global` 접미어가 없는 행이다.
  us.anthropic.claude-sonnet-4-6:
    name: Claude Sonnet 4.6 (US cross-region)
    input: 3.3
