[project]
name = "agent-dev-quiz"
version = "0.1.0"
description = "LangChain 예상 문제 풀이 웹앱 (MVP): 생성 배치, 채점·복습 API"
requires-python = ">=3.14,<3.15"
# langchain·langgraph·langchain-aws는 교안 sds-ax-practice(20df7f6) .venv 설치본과 같게 고정한다(NFR-3.1).
dependencies = [
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langgraph==1.2.17",
    "langchain-aws==1.9.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-dotenv",
    "pyyaml",
    "mcp==1.30.0",
    "langfuse>=5.1.0",
]

[project.scripts]
quiz = "quiz.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
